seed: 20260329
data_root: data
output_root: summary-MMmodel
summary_markdown: summary-MMmodel/EXPERIMENT_SUMMARY.md

session_filter:
  exclude_session_ids:
    - "MMdata_265.10s_0322_224132_no_secretion"

task:
  class_subset: [0, 2, 4]
  class_names: ["0", "2", "4"]

labels:
  0:
    - "0ml"
    - "0 ml"
    - "no"
    - "no secretion"
    - "none"
  1:
    - "1ml"
    - "1 ml"
  2:
    - "2ml"
    - "2 ml"
  3:
    - "3ml"
    - "3 ml"
  4:
    - "4ml"
    - "4 ml"

window_sec: 5.0
window_hop_sec: 5.0
audio_sample_rate: 16000
sensor_sample_rate: 100
audio_n_mels: 64
audio_n_fft: 1024
audio_hop_length: 160
audio_win_length: 400
min_window_sec: 5.0
pad_short_recording: false

batch_size: 16
num_workers: 0
epochs: 10
learning_rate: 0.001
weight_decay: 0.0001
weighted_sampler: true
class_weight: false
loss: cross_entropy
focal_gamma: 2.0
early_stop_patience: 4
grad_clip_norm: 3.0

grouped_cv:
  n_splits: 3
  n_repeats: 1
  val_fraction_of_train: 0.25

report:
  primary_experiment: hcaf_net_5s
  baseline_experiment: gated_baseline_5s
  main_experiment_names:
    - audio_only_5s
    - pressure_flow_5s
    - gated_baseline_5s
    - hcaf_net_5s
  window_experiment_names:
    - hcaf_net_5s
    - hcaf_net_10s
  ablation_experiment_names:
    - hcaf_net_5s
    - hcaf_net_minus_audio_5s
    - hcaf_net_minus_pressure_5s
    - hcaf_net_minus_flow_5s

main_experiments:
  - name: audio_only_5s
    display_name: Audio-only
    modality: audio_only
    window_sec: 5.0
    group: main
  - name: pressure_flow_5s
    display_name: Pressure+Flow-only
    modality: pressure_flow
    window_sec: 5.0
    group: main
  - name: gated_baseline_5s
    display_name: Gated Fusion Baseline
    modality: multimodal
    window_sec: 5.0
    group: main
  - name: hcaf_net_5s
    display_name: HCAF-Net
    modality: multimodal
    window_sec: 5.0
    group: main
    model_overrides:
      models:
        multimodal:
          model_type: hcaf_net

window_length_experiments:
  - name: hcaf_net_5s
    display_name: HCAF-Net 5 s
    modality: multimodal
    window_sec: 5.0
    group: window
    model_overrides:
      models:
        multimodal:
          model_type: hcaf_net
  - name: hcaf_net_10s
    display_name: HCAF-Net 10 s
    modality: multimodal
    window_sec: 10.0
    group: window
    model_overrides:
      models:
        multimodal:
          model_type: hcaf_net

ablation_experiments:
  - name: hcaf_net_5s
    display_name: HCAF-Net full
    modality: multimodal
    window_sec: 5.0
    group: ablation
    model_overrides:
      models:
        multimodal:
          model_type: hcaf_net
  - name: hcaf_net_minus_audio_5s
    display_name: HCAF-Net without audio
    modality: multimodal_minus_audio
    window_sec: 5.0
    group: ablation
    model_overrides:
      models:
        multimodal:
          model_type: hcaf_net
  - name: hcaf_net_minus_pressure_5s
    display_name: HCAF-Net without pressure
    modality: multimodal_minus_pressure
    window_sec: 5.0
    group: ablation
    model_overrides:
      models:
        multimodal:
          model_type: hcaf_net
  - name: hcaf_net_minus_flow_5s
    display_name: HCAF-Net without flow
    modality: multimodal_minus_flow
    window_sec: 5.0
    group: ablation
    model_overrides:
      models:
        multimodal:
          model_type: hcaf_net

models:
  audio_only:
    dropout: 0.3
    base_channels: 16
  pressure_flow:
    architecture: advanced
    dropout: 0.3
    hidden_dim: 128
    base_channels: 16
    embedding_dim: 64
    tcn_layers: 3
    num_heads: 4
    fusion_method: gated
  multimodal:
    architecture: advanced
    model_type: legacy
    dropout: 0.3
    audio_base_channels: 16
    sensor_base_channels: 16
    fusion_hidden_dim: 128
    embedding_dim: 128
    tcn_layers: 2
    num_heads: 4
    modality_dropout: 0.1
    sensor_fusion_method: gated
    final_fusion_method: softmax_gate
    audio_token_frames: 12
    sensor_token_length: 16
    self_attention_layers: 1
