seed: 20260327
data_root: data
output_root: outputs/baseline_5class
summary_markdown: EXPERIMENT_SUMMARY.md

session_filter:
  exclude_session_ids: []

labels:
  0:
    - "0ml"
    - "0 ml"
    - "no"
    - "no secretion"
    - "none"
  1:
    - "1ml"
    - "1 ml"
  2:
    - "2ml"
    - "2 ml"
  3:
    - "3ml"
    - "3 ml"
  4:
    - "4ml"
    - "4 ml"

window_sec: 10.0
window_hop_sec: 10.0
audio_sample_rate: 16000
sensor_sample_rate: 100
audio_n_mels: 64
audio_n_fft: 1024
audio_hop_length: 160
audio_win_length: 400
min_window_sec: 10.0
pad_short_recording: false

batch_size: 16
num_workers: 0
epochs: 12
learning_rate: 0.001
weight_decay: 0.0001
weighted_sampler: true
class_weight: false
early_stop_patience: 4

split:
  test_per_class: 1
  val_fraction_of_remaining: 0.25

grouped_cv:
  n_splits: 2
  n_repeats: 3
  val_fraction_of_train: 0.25

models:
  audio_only:
    dropout: 0.3
    base_channels: 16
  pressure_flow:
    dropout: 0.3
    hidden_dim: 128
    base_channels: 16
  multimodal:
    dropout: 0.3
    audio_base_channels: 16
    sensor_base_channels: 16
    fusion_hidden_dim: 128
