seed: 20260329
data_root: data
output_root: summary-MMmodel/audio_frontend_followup
summary_markdown: summary-MMmodel/audio_frontend_followup/EXPERIMENT_SUMMARY.md

session_filter:
  exclude_session_ids:
    - "MMdata_265.10s_0322_224132_no_secretion"

task:
  class_subset: [0, 2, 4]
  class_names: ["0", "2", "4"]

labels:
  0:
    - "0ml"
    - "0 ml"
    - "no"
    - "no secretion"
    - "none"
  1:
    - "1ml"
    - "1 ml"
  2:
    - "2ml"
    - "2 ml"
  3:
    - "3ml"
    - "3 ml"
  4:
    - "4ml"
    - "4 ml"

window_sec: 5.0
window_hop_sec: 5.0
audio_sample_rate: 16000
sensor_sample_rate: 100
audio_n_mels: 64
audio_n_fft: 1024
audio_hop_length: 160
audio_win_length: 400
pad_short_recording: false

batch_size: 16
num_workers: 0
epochs: 8
learning_rate: 0.001
weight_decay: 0.0001
weighted_sampler: true
class_weight: false
loss: cross_entropy
early_stop_patience: 3
grad_clip_norm: 3.0

grouped_cv:
  n_splits: 3
  n_repeats: 1
  val_fraction_of_train: 0.25

report:
  primary_experiment: hcaf_preemphasis_5s
  baseline_experiment: hcaf_base_5s
  main_experiment_names:
    - hcaf_base_5s
    - hcaf_preemphasis_5s
    - hcaf_pcen96_highpass80_5s
  window_experiment_names: []
  ablation_experiment_names: []

main_experiments:
  - name: hcaf_base_5s
    display_name: HCAF base audio
    modality: multimodal
    window_sec: 5.0
    group: main
    model_overrides:
      models:
        multimodal:
          model_type: hcaf_net

  - name: hcaf_preemphasis_5s
    display_name: HCAF + preemphasis
    modality: multimodal
    window_sec: 5.0
    group: main
    config_overrides:
      audio_frontend:
        preemphasis: 0.97
    model_overrides:
      models:
        multimodal:
          model_type: hcaf_net

  - name: hcaf_pcen96_highpass80_5s
    display_name: HCAF + PCEN96 HP80
    modality: multimodal
    window_sec: 5.0
    group: main
    config_overrides:
      audio_frontend:
        feature_type: pcen
        n_mels: 96
        f_min: 80.0
        f_max: 6000.0
        highpass_hz: 80.0
    model_overrides:
      models:
        multimodal:
          model_type: hcaf_net

window_length_experiments: []
ablation_experiments: []

models:
  multimodal:
    architecture: advanced
    model_type: hcaf_net
    dropout: 0.3
    audio_base_channels: 16
    sensor_base_channels: 16
    fusion_hidden_dim: 128
    embedding_dim: 128
    tcn_layers: 2
    num_heads: 4
    modality_dropout: 0.1
    sensor_fusion_method: gated
    final_fusion_method: softmax_gate
    audio_token_frames: 12
    sensor_token_length: 16
    self_attention_layers: 1
    audio_in_channels: 1
