seed: 20260330
data_root: data
output_root: summary-MMmodel/audio_targeted_search
summary_markdown: summary-MMmodel/audio_targeted_search/EXPERIMENT_SUMMARY.md

session_filter:
  exclude_session_ids:
    - "MMdata_265.10s_0322_224132_no_secretion"

task:
  class_subset: [0, 2, 4]
  class_names: ["0", "2", "4"]

labels:
  0:
    - "0ml"
    - "0 ml"
    - "no"
    - "no secretion"
    - "none"
  1:
    - "1ml"
    - "1 ml"
  2:
    - "2ml"
    - "2 ml"
  3:
    - "3ml"
    - "3 ml"
  4:
    - "4ml"
    - "4 ml"

window_sec: 5.0
window_hop_sec: 5.0
audio_sample_rate: 16000
sensor_sample_rate: 100
audio_n_mels: 64
audio_n_fft: 1024
audio_hop_length: 160
audio_win_length: 400
pad_short_recording: false

batch_size: 16
num_workers: 0
epochs: 6
learning_rate: 0.001
weight_decay: 0.0001
weighted_sampler: true
class_weight: false
loss: cross_entropy
early_stop_patience: 3
grad_clip_norm: 3.0

grouped_cv:
  n_splits: 3
  n_repeats: 1
  val_fraction_of_train: 0.25

models:
  audio_only:
    dropout: 0.3
    base_channels: 16
    in_channels: 1

experiments:
  - name: audio_preemphasis_16k
    display_name: preemphasis 16k
    modality: audio_only
    window_sec: 5.0
    config_overrides:
      audio_frontend:
        preemphasis: 0.97
    model_overrides:
      models:
        audio_only:
          in_channels: 1

  - name: audio_preemphasis_12k
    display_name: preemphasis 12k
    modality: audio_only
    window_sec: 5.0
    config_overrides:
      audio_sample_rate: 12000
      audio_n_fft: 768
      audio_hop_length: 120
      audio_win_length: 300
      audio_frontend:
        preemphasis: 0.97
    model_overrides:
      models:
        audio_only:
          in_channels: 1

  - name: audio_preemphasis_8k
    display_name: preemphasis 8k
    modality: audio_only
    window_sec: 5.0
    config_overrides:
      audio_sample_rate: 8000
      audio_n_fft: 512
      audio_hop_length: 80
      audio_win_length: 200
      audio_frontend:
        preemphasis: 0.97
    model_overrides:
      models:
        audio_only:
          in_channels: 1

  - name: audio_preemphasis_adaptive_crop
    display_name: preemphasis + adaptive top crop
    modality: audio_only
    window_sec: 5.0
    config_overrides:
      audio_frontend:
        preemphasis: 0.97
        adaptive_top_crop: true
        adaptive_top_crop_ratio: 0.03
        adaptive_top_crop_min_bins: 32
    model_overrides:
      models:
        audio_only:
          in_channels: 1

  - name: audio_preemphasis_fixed_crop
    display_name: preemphasis + fixed top crop
    modality: audio_only
    window_sec: 5.0
    config_overrides:
      audio_frontend:
        preemphasis: 0.97
        mel_bin_end: 48
        output_n_mels: 64
    model_overrides:
      models:
        audio_only:
          in_channels: 1

  - name: audio_pcen96_hp80
    display_name: PCEN96 HP80
    modality: audio_only
    window_sec: 5.0
    config_overrides:
      audio_frontend:
        feature_type: pcen
        n_mels: 96
        f_min: 80.0
        f_max: 6000.0
        highpass_hz: 80.0
    model_overrides:
      models:
        audio_only:
          in_channels: 1

  - name: audio_pcen96_hp80_adaptive_crop
    display_name: PCEN96 HP80 + adaptive top crop
    modality: audio_only
    window_sec: 5.0
    config_overrides:
      audio_frontend:
        feature_type: pcen
        n_mels: 96
        f_min: 80.0
        f_max: 6000.0
        highpass_hz: 80.0
        adaptive_top_crop: true
        adaptive_top_crop_ratio: 0.03
        adaptive_top_crop_min_bins: 48
    model_overrides:
      models:
        audio_only:
          in_channels: 1
