seed: 20260329
data_root: data
output_root: outputs/iter_pressure_flow_fusion
summary_markdown: outputs/iter_pressure_flow_fusion/EXPERIMENT_SUMMARY.md
split_manifest_source: summary-MMmodel/split_manifest.json

session_filter:
  exclude_session_ids: []

task:
  class_subset: [0, 2, 4]
  class_names: ["0", "2", "4"]

labels:
  0: ["0ml", "0 ml", "no", "no secretion", "none"]
  1: ["1ml", "1 ml"]
  2: ["2ml", "2 ml"]
  3: ["3ml", "3 ml"]
  4: ["4ml", "4 ml"]

window_sec: 5.0
window_hop_sec: 5.0
audio_sample_rate: 16000
sensor_sample_rate: 100
audio_n_mels: 64
audio_n_fft: 1024
audio_hop_length: 160
audio_win_length: 400
min_window_sec: 5.0
pad_short_recording: false

batch_size: 16
num_workers: 0
epochs: 10
learning_rate: 0.001
weight_decay: 0.0001
weighted_sampler: true
class_weight: false
loss: cross_entropy
focal_gamma: 2.0
early_stop_patience: 4
grad_clip_norm: 3.0

grouped_cv:
  n_splits: 3
  n_repeats: 1
  val_fraction_of_train: 0.25

report:
  primary_experiment: pressure_flow_5s_baseline
  baseline_experiment: pressure_flow_5s_baseline
  main_experiment_names:
    - pressure_flow_5s_baseline
    - pressure_flow_5s_softmax_gate
    - pressure_flow_5s_concat_mlp
  window_experiment_names: []
  ablation_experiment_names: []

main_experiments:
  - name: pressure_flow_5s_baseline
    display_name: Pressure+Flow (gated)
    modality: pressure_flow
    window_sec: 5.0
    group: main
  - name: pressure_flow_5s_softmax_gate
    display_name: Pressure+Flow (softmax-gate)
    modality: pressure_flow
    window_sec: 5.0
    group: main
    model_overrides:
      models:
        pressure_flow:
          fusion_method: softmax_gate
  - name: pressure_flow_5s_concat_mlp
    display_name: Pressure+Flow (concat-mlp)
    modality: pressure_flow
    window_sec: 5.0
    group: main
    model_overrides:
      models:
        pressure_flow:
          fusion_method: concat_mlp

window_length_experiments: []
ablation_experiments: []

models:
  audio_only:
    dropout: 0.3
    base_channels: 16
  pressure_flow:
    architecture: advanced
    dropout: 0.3
    hidden_dim: 128
    base_channels: 16
    embedding_dim: 64
    tcn_layers: 3
    num_heads: 4
    fusion_method: gated
  multimodal:
    architecture: advanced
    model_type: legacy
    dropout: 0.3
    audio_base_channels: 16
    sensor_base_channels: 16
    fusion_hidden_dim: 128
    embedding_dim: 128
    tcn_layers: 2
    num_heads: 4
    modality_dropout: 0.1
    sensor_fusion_method: gated
    final_fusion_method: softmax_gate
    audio_token_frames: 12
    sensor_token_length: 16
    self_attention_layers: 1
